name: CI

# Runs on every pull request and every push to main. The repo is public, so
# Actions minutes are free and a run needs no opt-in. Any branch can also be
# run from the Actions tab.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its run still in flight. Each run on main gets a
# group of its own, so merges run side by side rather than cancelling each
# other, and a failure points at the merge that caused it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  line-count:
    name: Line Count
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required: diffs the merge base against the head, so both have to be in the clone.

      # Installs cloc, resolves the merge base, and writes the job summary.
      - name: Count the changed lines
        uses: bvandrc/pr-diff-line-count@v1
        with:
          comment: false

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint package.json
        uses: bvandrc/lint-package-json@v2

      - name: Run lint
        run: pnpm run check

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      # The tests run in real Chromium (Vitest's browser mode), which
      # Playwright installs here along with the system libraries it needs.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run unit tests
        run: pnpm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm run build
